name: Eatsii
description: >-
  Eatsii is a Jakarta, Indonesia based foodtech startup operating a cloud
  kitchen platform. It runs a cloud kitchen concept that offers takeaway and
  delivery alongside dine-in service, and markets cloud kitchen space to F&B
  operators under a franchise partnership model, positioning itself as helping
  food and beverage companies run a more efficient kitchen in the food delivery
  era. The company describes itself as combining a heartfelt touch with data
  and business strategy, and lists 11-50 employees in Food and Beverage
  Services. It was surfaced through the 500 Global (500 Durians) portfolio.
  Eatsii publishes no developer program, public API, or technical
  documentation, and as of July 2026 its eatsii.com domain does not serve a
  live website.
